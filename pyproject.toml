[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concordance"
version = "0.1.0"
description = "Reading Canada's public record as a hundred-year instrument"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jonathan Capone" }]

# Deliberately zero required dependencies. The whole pipeline -- fetching,
# page parsing, routing, extraction against a local model, and scoring -- runs
# on the standard library alone. Anyone can clone this and get a real result
# without installing anything or holding an API key.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# No console-script entry points, deliberately. The previous
# `concordance-gold = "scripts.run_gold:main"` pointed at a module the
# install never ships ([tool.setuptools.packages.find] includes only
# concordance*, and scripts/ is not a package), so the documented
# `pip install -e .` produced a command that failed on first use. The
# scripts are run the way the README shows: `python scripts/run_gold.py`.

[tool.setuptools.packages.find]
include = ["concordance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
